name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Production only ever comes from main. A manual "Run workflow" on any
    # other branch shows this job (and deploy, which needs it) as skipped,
    # not failed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Custom domain (public/CNAME) serves the site at its own root, not
      # at /La-emperatriz — so NEXT_PUBLIC_BASE_PATH stays unset here now,
      # same as local dev/build.
      # NEXT_PUBLIC_LEADS_ENDPOINT (contact form destination, see
      # lib/leads.ts) is inlined at build time — set it as a repository
      # variable. If unset, the form reports a send error in production.
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_LEADS_ENDPOINT: ${{ vars.NEXT_PUBLIC_LEADS_ENDPOINT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
